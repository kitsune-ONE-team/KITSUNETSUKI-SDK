version: '3.4'

services:
  sdk:
    build:
      context: .
    ports:
      - '2201:22'
    hostname: sdk
    environment:
      - HOME=${HOME}
      - MAMBA_EXE=/root/.local/bin/micromamba
      - MAMBA_ROOT_PREFIX=/root/.local/share/mamba
    volumes:
      - ./app:/app:z
      - ${HOME}/Dev/Panda3D:${HOME}/Dev/Panda3D:z
      - /var/mnt/games/Windows/shared:/shared:z
      - /var/mnt/games/steamapps/common/Blender:/Blender:z
    command: bash -c "mkdir /run/sshd && /usr/sbin/sshd -D"
    network: 'slirp4netns:allow_host_loopback=true'
