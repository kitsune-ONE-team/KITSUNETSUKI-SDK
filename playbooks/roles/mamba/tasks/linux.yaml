- name: mkdir
  file:
    path: "{{ install_prefix }}"
    state: directory
    mode: '0755'

- name: copy env.yaml
  copy:
    src: roles/mamba/environment-linux.yaml
    dest: "{{ install_prefix }}environment.yaml"

- name: stat mamba
  stat:
    path: "{{ install_prefix }}{{ install_dir }}"
  register: ksdk

- name: mamba env create
  command: >
    {{ micromamba }} env create --yes
    --file {{ install_prefix }}environment.yaml
    --prefix {{ install_prefix }}{{ install_dir }}
  when: not ksdk.stat.exists
