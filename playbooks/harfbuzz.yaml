- name: harfbuzz
  hosts: all
  gather_facts: yes
  vars:
    source_dir: harfbuzz
    build_dir: harfbuzz

    git_repo: https://github.com/harfbuzz/harfbuzz.git
    git_refs: refs/tags/
    git_version: 14.2.1

    cmake_command: >
      cmake
      -G "{{ cmake_generator }}"
      -DBUILD_SHARED_LIBS=OFF
      -DBUILD_STATIC_LIBS=ON
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_C_FLAGS={{ cmake_c_flags }}
      -DCMAKE_CXX_FLAGS={{ cmake_cxx_flags }}
      -DCMAKE_INSTALL_PREFIX={{ harfbuzz_prefix }}
      -DHB_HAVE_FREETYPE=YES
      -DFREETYPE_INCLUDE_DIR_freetype2={{ freetype_include_freetype2 }}
      -DFREETYPE_INCLUDE_DIR_ft2build={{ freetype_include_freetype2 }}
      -DFREETYPE_LIBRARY_RELEASE={{ freetype_library }}
      -DMULTITHREADED_BUILD={{ build_threads }}
      {{ source_prefix }}{{ source_dir }}

  roles:
    - cmake
